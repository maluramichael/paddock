name: Bug report
description: Something in Paddock is broken or behaves unexpectedly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in the details below so it can be reproduced.
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: Press Win+R, type `winver` and copy the version and build.
      placeholder: "e.g. Windows 11 24H2, build 26100.2314"
    validations:
      required: true
  - type: input
    id: paddock-version
    attributes:
      label: Paddock version
      description: Shown in Settings → Info.
      placeholder: "e.g. 1.4.2"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation
      options:
        - MSI installer
        - Portable ZIP
        - Built from source
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Display setup
      description: Number of monitors and their scaling.
      placeholder: "e.g. 2 monitors: 4K at 150 %, 1080p at 100 %"
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, step by step?
      placeholder: |
        1. Create an area by right-dragging on the desktop
        2. Drag a file from Explorer into it
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log or screenshots
      description: Settings → Info → "Protokoll" opens the log file (%LOCALAPPDATA%\Paddock\paddock.log). Paste the relevant lines or attach screenshots.
      render: text
    validations:
      required: false
